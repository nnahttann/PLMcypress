jobs:
  your-job-name:
    runs-on: ubuntu-latest
    # Add this permissions block:
    permissions:
      pull-requests: write
      contents: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Merge PR
        run: gh pr merge "$PR_URL" --merge --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
