name: Auto-merge Qwen PRs

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # เช็คเงื่อนไขให้ทำงานเฉพาะ PR ของ Qwen
    if: startsWith(github.event.pull_request.title, 'Update from task')
    steps:
      - name: Merge Pull Request directly
        run: gh pr merge "$PR_URL" --merge --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
